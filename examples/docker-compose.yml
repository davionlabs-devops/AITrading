version: '3.8'

services:
  signal-api:
    build: .
    container_name: nofx-signal-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - BINANCE_API_TIMEOUT=10
      - CACHE_TTL=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

